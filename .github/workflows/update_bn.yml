name: Update beIN Sports EPG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EPG Grabber
        run: npm install -g @iptv-org/epg

      - name: Grab beIN Sports Guide
        run: |
          epg-grabber --site=beinsports.com --output=guide.xml

      - name: Deploy Finished Guide to GitHub Pages
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          target-folder: .
