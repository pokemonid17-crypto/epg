name: Update beIN Sports EPG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Clone Official IPTV-Org EPG Engine
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-engine

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: epg-engine/package-lock.json

      - name: Install EPG Engine Dependencies
        run: |
          cd epg-engine
          npm install

      - name: Run Official Grabber for beIN MENA Arabic
        run: |
          cd epg-engine
          # Run the engine using exclusively the official MENA-AR channel mapping file
          npm run grab -- --channels=sites/beinsports.com/beinsports.com_mena-ar.channels.xml --output=../guide.xml

      - name: Clean Workspace Environment
        run: |
          rm -rf epg-engine

      - name: Deploy Native Guide to GitHub Pages
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          target-folder: .
