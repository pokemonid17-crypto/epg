name: Update BN Sport EPG

on:
  schedule:
    # Runs at 07:00 UTC (which is 2:00 AM Manitoba/CDT)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Clone Official IPTV-Org EPG Engine
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-engine

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Run Grabber
        env:
          # Injecting a public proxy to mask GitHub's IP and bypass the 403 restriction
          HTTP_PROXY: http://185.162.229.157:80
          HTTPS_PROXY: http://185.162.229.157:80
        run: |
          cd epg-engine
          npm install
          
          # Parse the channels using the proxy environment
          npm run channels:parse -- --config=./sites/beinsports.com/beinsports.com.config.js --output=./sites/beinsports.com/beinsports.com_mena-ar.channels.xml --set=region:mena --set=lang:ar
          
          # Run the main EPG grabber
          npm run grab -- --channels=sites/beinsports.com/beinsports.com_mena-ar.channels.xml --output=../guide.xml

      - name: Prepare Deployment
        run: |
          mkdir -p public
          mv guide.xml public/guide.xml

      - name: Deploy to GitHub Pages
        uses: jamesives/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: public
          branch: gh-pages
          target-folder: .
          single-commit: true
